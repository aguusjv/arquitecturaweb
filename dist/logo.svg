<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icono: Marco con símbolo tech -->
  <g>
    <!-- Marco exterior -->
    <rect x="10" y="20" width="100" height="100" rx="12" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.95"/>
    
    <!-- Marco interior -->
    <rect x="15" y="25" width="90" height="90" rx="10" fill="none" stroke="#0099ff" stroke-width="1" opacity="0.5"/>
    
    <!-- Puntos de conexión en esquinas -->
    <circle cx="15" cy="25" r="3.5" fill="#00d4ff" opacity="0.9"/>
    <circle cx="110" cy="25" r="3.5" fill="#0099ff" opacity="0.8"/>
    <circle cx="15" cy="120" r="3.5" fill="#0099ff" opacity="0.8"/>
    <circle cx="110" cy="120" r="3.5" fill="#00d4ff" opacity="0.9"/>
    
    <!-- Símbolo de código: < / > -->
    <text x="62" y="82" font-size="52" font-weight="bold" fill="url(#grad1)" font-family="'Courier New', monospace" text-anchor="middle" dominant-baseline="middle">&lt;/&gt;</text>
    
    <!-- Línea decorativa inferior -->
    <line x1="20" y1="130" x2="100" y2="130" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Texto: ARQUITECTURA WEB -->
  <g>
    <!-- Separador vertical -->
    <line x1="125" y1="25" x2="125" y2="120" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
    
    <!-- ARQUITECTURA -->
    <text x="135" y="55" font-size="18" font-weight="900" fill="#ffffff" font-family="Arial, sans-serif" letter-spacing="0.5">ARQUITECTURA</text>
    
    <!-- WEB -->
    <text x="135" y="85" font-size="24" font-weight="900" fill="url(#grad1)" font-family="Arial, sans-serif" letter-spacing="2">WEB</text>
  </g>
</svg>